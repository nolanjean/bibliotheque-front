@if (chargement()) {
  <p>Chargement en cours...</p>
}

@if (erreur()) {
  <p class="erreur">{{ erreur() }}</p>
}

@if (livre(); as l) {
  <h1>{{ l.titre }}</h1>
  <p>ISBN : {{ l.isbn | isbnFormat }}</p>
  <p>Auteur : {{ l.auteurNom }}</p>
  <p>Exemplaires disponibles : {{ l.nombreExemplaires }}</p>
}

<a routerLink="/livres">Retour à la liste</a>
<a [routerLink]="['/livres', livre()?.id, 'modifier']">Modifier</a><button (click)="supprimer()">Supprimer</button>
